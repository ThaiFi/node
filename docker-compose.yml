# ThaiFi node — follower/RPC node (chain id 17)
# Used together with the guide in README.md
#
# Before running:
#   1) mkdir -p data && printf '%s' "$(openssl rand -hex 32)" > data/discovery-secret
#   2) (recommended) load a snapshot instead of syncing from genesis — see README.md §2
services:
  node:
    image: ghcr.io/thaifi/thbos:thbos-v1.18.3
    container_name: thaifi-node
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./data:/data
    command:
      - node
      - --chain
      - /config/genesis.json
      - --datadir
      - /data
      - --p2p-secret-key
      - /data/discovery-secret
      - --http
      - --http.addr
      - 0.0.0.0
      - --http.port
      - "8545"
      - --ws
      - --ws.addr
      - 0.0.0.0
      - --ws.port
      - "8546"
      - --authrpc.port
      - "8551"
      - --port
      - "30303"
      - --discovery.port
      - "30306"
      # Connect to ThaiFi's public RPC node (P2P) — validator IPs are kept private;
      # your node discovers additional peers automatically from here
      - --trusted-peers
      - "enode://85b126a437e2552abc041d98a613aa4a1928186eaac403d61a059f9555f380bc3d6166a78e4bb23229bdbe363c4a0a687732725a7cfd1edf7d731223d9049d94@65.21.192.220:31320"
      # Do not use Tempo's public bootnodes (other chains)
      - --tempo.bootnodes-endpoint
      - none
      # Follow consensus via ThaiFi's public follow stream
      - --follow
      - wss://ws.thaifi.com
