# ThaiFi node — follower/RPC node (chain id 17)
# Used together with the guide in README.md
#
# Before running:
#   1) mkdir -p data && printf '%s' "$(openssl rand -hex 32)" > data/discovery-secret
#   2) (recommended) load a snapshot instead of syncing from genesis — see README.md §2
services:
  node:
    image: ghcr.io/tempoxyz/tempo@sha256:1ac53d67fa9738f5a10de50f2e3e3e77f9ac598ad7a8c6bdf68c6921f09194e7
    container_name: thaifi-node
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    volumes:
      - ./genesis.json:/config/genesis.json:ro
      - ./data:/data
    command:
      - node
      - --chain
      - /config/genesis.json
      - --datadir
      - /data
      - --p2p-secret-key
      - /data/discovery-secret
      - --http
      - --http.addr
      - 0.0.0.0
      - --http.port
      - "8545"
      - --ws
      - --ws.addr
      - 0.0.0.0
      - --ws.port
      - "8546"
      - --authrpc.port
      - "8551"
      - --port
      - "30303"
      - --discovery.port
      - "30306"
      # Connect directly to ThaiFi validators (P2P)
      - --trusted-peers
      - "enode://3e9124710f7017b7e7621883f8b3faa56718c524143aa3e2b3821093ed403d50d3f54abda29d4165fa3634aa53f85ca414f5491a6f0baa51dea7a538659bbac3@119.59.123.101:31303,enode://5d373e710844cacb2738f75f496aa56b217a48102e16d50cf1c727168c99a99ca38100e6af0845b0a8b01dd4ecf0cb5fede69c292e481a50dd240c7fc98bd4eb@119.59.123.101:31304,enode://baa0aa5b9e0dfe6b9fd0f7700be73ced16693ab22f810afe7bb998d53f3a4325ea51afb3f472570a7621e172d5fc6472c50be5feef0efd3287895b5102d7ad81@119.59.123.107:30303"
      # Do not use Tempo's public bootnodes (other chains)
      - --tempo.bootnodes-endpoint
      - none
      # Follow consensus via ThaiFi's public follow stream
      - --follow
      - wss://ws.thaifi.com
